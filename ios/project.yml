name: Radio
options:
  bundleIdPrefix: ro.pom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Real team + automatic signing: an unsigned executable cannot launch on a
    # DEVICE ("The executable is not codesigned",
    # LaunchExecutableValidationErrorDomain 1). CODE_SIGNING_ALLOWED was "NO"
    # here, which worked on the simulator and failed on hardware.
    DEVELOPMENT_TEAM: "RZ2G93W936"
    CODE_SIGN_STYLE: Automatic
targets:
  Radio:
    type: application
    platform: iOS
    sources:
      - path: Radio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.pom.radio.ios
        # NO entitlements file on purpose. The only key it carried was
        # com.apple.developer.carplay-audio, and CarPlay entitlements are NOT a
        # capability you can enable for an App ID — Apple grants them on request
        # (developer.apple.com/contact/carplay, category "Audio apps"). Until
        # granted, the key cannot be added to any provisioning profile, so the
        # build failed with "Entitlement com.apple.developer.carplay-audio not
        # found and could not be included in profile". Do not re-add it before
        # the request is approved; see Radio/CarPlaySceneDelegate.swift.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # NOTE: orientations are NOT declared as INFOPLIST_KEY_* here. They live
        # in `info.properties` below, which xcodegen writes into
        # Radio/Info.plist (the explicit Info.plist wins over INFOPLIST_KEY_* —
        # no key here on purpose).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Radio/Info.plist
      properties:
        NSCameraUsageDescription: Camera access is used to scan the macOS QR code and import a stream into Radio.
        CFBundleURLTypes:
          - CFBundleURLName: ro.pom.radio.ios
            CFBundleURLSchemes:
              - radio
        UILaunchScreen: {}
        # Portrait-locked UI. The app targets iPhone+iPad (family 1,2); Apple's
        # validation requires ALL orientations "unless the app requires full
        # screen" — UIRequiresFullScreen=YES declares that exemption, so
        # portrait-only is accepted (this is the CarPlay-audio app shape too).
        # These keys are the SOURCE OF TRUTH: xcodegen generates Radio/Info.plist
        # from them, so they must be edited here and never hand-written into the
        # plist (a regenerate would silently wipe a direct plist edit).
        UIRequiresFullScreen: true
        # Background audio: without this the stream stops the moment the app
        # leaves the foreground. It is also what makes the app controllable from
        # a car head unit via MPNowPlayingInfoCenter/MPRemoteCommandCenter while
        # the CarPlay entitlement is still unapproved.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
  RadioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RadioTests
    dependencies:
      - target: Radio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Radio.app/Radio"
        BUNDLE_LOADER: "$(TEST_HOST)"
